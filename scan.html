<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Barcode Scanner</title>
  
  <!-- Load the open-source html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: #f4f4f9;
    }
    #reader {
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background: white;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      width: 100%;
      max-width: 470px;
      background-color: #e2f0cb;
      border: 1px solid #b5d596;
      border-radius: 8px;
      font-size: 1.2rem;
      text-align: center;
      word-break: break-all;
      display: none; /* Hidden until a scan happens */
    }
    h1 {
      font-size: 1.5rem;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Inventory Scanner</h1>
  
  <!-- The camera feed will be injected into this div -->
  <div id="reader"></div>

  <!-- The scanned text will appear in this div -->
  <div id="result">Waiting for scan...</div>

  <script>
    // 1. This function runs the moment a barcode is successfully decoded
    function onScanSuccess(decodedText, decodedResult) {
      
      // Make the result box visible
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      
      // Print the scanned value to the screen
      resultDiv.innerHTML = `<strong>Scanned Item:</strong> <br> ${decodedText}`;
      
      // ---------------------------------------------------------
      // CUSTOM LOGIC GOES HERE
      // Once you have the 'decodedText', you can do whatever you want.
      // For example, sending it to your database via an API call:
      //
      // fetch('https://your-custom-inventory-api.com/update', { 
      //    method: 'POST', 
      //    body: JSON.stringify({ barcode: decodedText }) 
      // });
      // ---------------------------------------------------------
    }

    // 2. This function runs when the camera sees something that ISN'T a barcode.
    // It fires constantly, so we usually just leave it empty to ignore the errors.
    function onScanFailure(error) {
      // Ignore background errors
    }

    // 3. Configure the scanner (Frames per second, and the visual scanning box)
    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        // Wide box so long 1D barcodes (UPC, Code 128) fit inside it
        qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(h * 0.5) }),
        // Use the browser's native barcode reader when available (much better at 1D codes)
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        // Prefer the back camera on phones
        videoConstraints: { facingMode: "environment" },
        rememberLastUsedCamera: true
      },
      /* verbose= */ false
    );

    // 4. Start the scanner and attach our functions
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>

</body>
</html>
